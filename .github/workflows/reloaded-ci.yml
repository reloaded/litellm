name: reloaded-ci

# Focused CI for the `reloaded` downstream integration branch.
# We deliberately do NOT try to make BerriAI/litellm's full upstream
# workflow matrix green on this fork — it depends on upstream secrets
# / infra and is irrelevant to shipping the reloaded image. This gate
# checks the code we actually change; the image build/publish workflow
# is the integration gate.

on:
  pull_request:
    branches: [reloaded]
  push:
    branches: [reloaded]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Byte-compile the litellm package (syntax / port integrity)
        run: python -m compileall -q litellm
      - name: Ruff lint (changed backend area)
        run: |
          pip install -q ruff
          ruff check litellm/proxy/_experimental/mcp_server || true

  mcp-auth-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install litellm (proxy extras) + test deps
        run: |
          pip install -q -e ".[proxy]"
          pip install -q pytest pytest-asyncio respx
      - name: Reloaded downstream tests + targeted MCP auth tests
        run: |
          set -eux
          PATHS="tests/test_litellm/proxy/_experimental/mcp_server/auth/test_user_api_key_auth_mcp.py"
          # tests/reloaded/ holds this fork's own tests, isolated from
          # upstream test churn. Include it when present (it is added by
          # the reciprocal-binding workitem onward).
          [ -d tests/reloaded ] && PATHS="$PATHS tests/reloaded/"
          python -m pytest -q --no-header -p no:cacheprovider $PATHS

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/litellm-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/litellm-dashboard/package-lock.json
      - name: Install dashboard deps
        run: npm ci --no-audit --no-fund
      - name: Typecheck production source (tsc, tests excluded)
        run: npx tsc --noEmit -p tsconfig.ci.json
      - name: AccessGroups component tests
        run: npx vitest run src/components/AccessGroups
