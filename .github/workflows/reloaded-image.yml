name: reloaded-image

# Build (and, on reloaded, publish) the reloaded/litellm container image
# from source — so all merged backend + dashboard (Next.js) changes ship.
#
# Tag scheme (locked): <upstream-tag>-<our-semver>, e.g.
#   ghcr.io/reloaded/litellm:v1.83.14-stable.patch.3-1.0.0  (+ :latest)
# The upstream base tag stays in the image tag for provenance; our semver
# is the downstream version line.
#
# Platform decision (AFK-autonomous; logged in the PR): linux/amd64 only.
# A full from-source multi-arch build (Python + Node UI) under QEMU arm64
# is slow/flaky and would jeopardise the unattended publish+deploy. The
# ai-network target runs amd64. arm64 can be added later by extending
# PLATFORMS if a node needs it — deliberately not gating the deploy on an
# emulated build.

on:
  push:
    branches: [reloaded]
  pull_request:
    branches: [reloaded]
  workflow_dispatch:
    inputs:
      reloaded_version:
        description: "Our semver (suffix after the upstream tag)"
        required: true
        default: "1.0.0"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/reloaded/litellm
  UPSTREAM_TAG: v1.83.14-stable.patch.3
  RELOADED_VERSION: ${{ github.event.inputs.reloaded_version || '1.0.0' }}
  PLATFORMS: linux/amd64

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: tags
        run: |
          set -eux
          FULL="${UPSTREAM_TAG}-${RELOADED_VERSION}"
          echo "full=$FULL" >>"$GITHUB_OUTPUT"
          echo "version_tag=${IMAGE}:${FULL}" >>"$GITHUB_OUTPUT"
          echo "latest_tag=${IMAGE}:latest" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Publish only on push to reloaded or manual dispatch — never from a PR.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (PR — no push, validates the image builds with our changes)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push (reloaded / dispatch)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ steps.tags.outputs.version_tag }}
            ${{ steps.tags.outputs.latest_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/reloaded/litellm
            io.reloaded.upstream-litellm-tag=${{ env.UPSTREAM_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: always()
        run: |
          {
            echo "### reloaded/litellm image"
            echo "- tag: \`${{ steps.tags.outputs.full }}\`"
            echo "- platforms: \`${PLATFORMS}\`"
            echo "- pushed: ${{ github.event_name != 'pull_request' }}"
          } >>"$GITHUB_STEP_SUMMARY"
